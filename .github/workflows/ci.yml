# Same checks as .githooks/pre-commit, on GitHub for every push and pull request —
# including the frontend developer's. The AI tests (torch + weights + data) run only locally.
name: CI
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.14", cache: pip, cache-dependency-path: backend/requirements*.txt }
      - run: pip install -r requirements-dev.txt  # runtime deps + pytest/httpx/ruff
      - run: ruff check .  # syntax errors + pyflakes (backend/ruff.toml)
      - run: pytest -m "not ai" -p no:warnings -rs

  backend-postgres:
    # The same fast suite on PostgreSQL (production database); its schema is wiped before every test.
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      postgres:
        image: postgres:17.6
        env: { POSTGRES_USER: medseal, POSTGRES_PASSWORD: medseal, POSTGRES_DB: medseal_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U medseal" --health-interval 5s --health-retries 10
    env:
      MEDSEAL_TEST_DB_URL: postgresql+psycopg://medseal:medseal@localhost:5432/medseal_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.14", cache: pip, cache-dependency-path: backend/requirements*.txt }
      - run: pip install -r requirements-dev.txt
      - run: pytest -m "not ai" -p no:warnings -rs

  contracts:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: contracts } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: contracts/package-lock.json }
      - run: npm ci
      - run: npx hardhat test

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: by_billy/frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: by_billy/frontend/package-lock.json }
      - run: npm ci
      - run: npx next typegen  # route/layout types (LayoutProps...) that next dev/build normally generate
      - run: npx tsc --noEmit -p .
      - run: npm run lint
      - run: npm run build  # demo-data mode (no NEXT_PUBLIC_API_URL): catches mocks out of sync with types
