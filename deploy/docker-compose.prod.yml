# MedSeal production stack. From deploy/:
#   cp env.prod.example .env.prod && chmod 600 .env.prod   # fill in every value (see docs/DEPLOY.md)
#   put the TLS certificate in deploy/certs/fullchain.pem + privkey.pem
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Networks: `data` (PostgreSQL) is reachable only by the API and the worker; `app` joins the proxy,
# the website and the API; only the proxy publishes ports. API and worker also sit on `egress` to
# reach the blockchain RPC. Every service runs as a non-root user with a read-only filesystem.
name: medseal

x-hardened: &hardened
  restart: unless-stopped
  read_only: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  tmpfs: ["/tmp"]

x-backend: &backend
  <<: *hardened
  build: { context: ../backend, args: { INSTALL_AI: "1" } }
  image: medseal-backend:latest
  env_file: .env.prod
  environment:
    MEDSEAL_ENV: production
    MEDSEAL_DB_URL: postgresql+psycopg://medseal:${MEDSEAL_PG_PASSWORD:?}@db:5432/medseal
    MEDSEAL_CORS_ORIGINS: https://${MEDSEAL_DOMAIN:?}
    MEDSEAL_CORS_ORIGIN_REGEX: ""
  volumes:
    - keys:/data/keys
    - storage:/data/storage
    - anchors:/data/anchors
    - home:/data/home          # AI model weights cache (~/.torchxrayvision)
  depends_on:
    db: { condition: service_healthy }
  networks: [data, app, egress]

services:
  db:
    image: postgres:17.6-alpine
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    environment:
      POSTGRES_USER: medseal
      POSTGRES_DB: medseal
      POSTGRES_PASSWORD: ${MEDSEAL_PG_PASSWORD:?set MEDSEAL_PG_PASSWORD in .env.prod}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medseal -d medseal"]
      interval: 5s
      retries: 20
    networks: [data]

  api:
    <<: *backend
    environment:
      MEDSEAL_ENV: production
      MEDSEAL_PROCESS_ROLE: api
      MEDSEAL_DB_URL: postgresql+psycopg://medseal:${MEDSEAL_PG_PASSWORD:?}@db:5432/medseal
      MEDSEAL_CORS_ORIGINS: https://${MEDSEAL_DOMAIN:?}
      MEDSEAL_CORS_ORIGIN_REGEX: ""

  worker:
    <<: *backend
    command: ["python", "-m", "app.worker"]
    healthcheck: { disable: true }
    environment:
      MEDSEAL_ENV: production
      MEDSEAL_PROCESS_ROLE: worker
      MEDSEAL_DB_URL: postgresql+psycopg://medseal:${MEDSEAL_PG_PASSWORD:?}@db:5432/medseal
      MEDSEAL_CORS_ORIGINS: https://${MEDSEAL_DOMAIN:?}
      MEDSEAL_CORS_ORIGIN_REGEX: ""
    volumes:
      - keys:/data/keys
      - storage:/data/storage
      - anchors:/data/anchors
      - home:/data/home
      - ${MEDSEAL_WATCH_HOST_DIR:-./watch}:/data/watch   # scanner drop folder (scanner/, incoming/)

  frontend:
    <<: *hardened
    build:
      context: ../by_billy/frontend
      args: { NEXT_PUBLIC_API_URL: "https://${MEDSEAL_DOMAIN:?}/backend" }
    image: medseal-frontend:latest
    environment:
      MEDSEAL_BACKEND_URL: http://api:8000/api
      MEDSEAL_DEVICE_TOKEN: ${MEDSEAL_DEVICE_TOKEN:-}
    depends_on: [api]
    networks: [app]

  proxy:
    <<: *hardened
    image: nginx:1.29-alpine
    cap_add: ["NET_BIND_SERVICE", "CHOWN", "SETUID", "SETGID"]
    tmpfs: ["/tmp", "/var/cache/nginx", "/var/run"]
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on: [frontend, api]
    networks: [app, egress]

volumes:
  pgdata:
  keys:
  storage:
  anchors:
  home:

networks:
  data: { internal: true }
  app: { internal: true }
  egress: {}
