# MedSeal reverse proxy: the only container with published ports. TLS terminates here.
#   https://<domain>/           -> website (Next.js)
#   https://<domain>/backend/   -> backend API (public endpoints, gateways with device tokens)
worker_processes auto;
events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  server_tokens off;
  client_max_body_size 52m;            # 50 MB images + multipart overhead (inbox batches: below)
  proxy_read_timeout 300s;             # verification with AI can take a while on CPU

  # Password guessing gets a tiny budget per IP (on top of the account lockout in the backend).
  limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
  limit_req_status 429;

  log_format main '$remote_addr [$time_iso8601] "$request_method $uri" $status $body_bytes_sent '
                  '$request_time rid=$request_id';    # no query strings: they can carry tokens
  access_log /dev/stdout main;

  server {
    listen 80;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    http2 on;
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;   # overwrite, never append a client-supplied chain
    proxy_set_header X-Request-ID $request_id;

    location = /api/session/login { limit_req zone=login burst=5 nodelay; proxy_pass http://frontend:3000; }
    location = /backend/auth/login { limit_req zone=login burst=5 nodelay; proxy_pass http://api:8000/api/auth/login; }
    location /backend/ { limit_req zone=api burst=60 nodelay; proxy_pass http://api:8000/api/; }
    location /api/inbox { client_max_body_size 210m; proxy_read_timeout 900s; proxy_pass http://frontend:3000; }
    location / { proxy_pass http://frontend:3000; }
  }
}
